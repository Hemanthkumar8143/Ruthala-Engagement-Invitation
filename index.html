<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c2022">
<meta name="description" content="Mounisha & Bhanu Sankar — Engagement invitation">
<title>Mounisha & Bhanu Sankar — Engagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --wine:#74243d;--wine-dark:#5a1d31;--gold:#b98a35;--gold-light:#e2c487;
  --cream:#f8ece2;--paper:#fffaf5;--ink:#4c362f;--rose:#e9cacc;
  --shadow:0 24px 70px rgba(52,30,28,.19)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#24191b}
body{
  margin:0;color:var(--wine);
  background:radial-gradient(circle at 50% 0,#fff9f2 0,#eeddd2 58%,#c5ada1 100%);
  font-family:"Cormorant Garamond",serif
}
button,a{font:inherit}
a{text-decoration:none;color:inherit}
img{display:block;width:100%;height:auto}
.container{width:min(100%,640px);margin:auto}

.inv{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:14px 8px;position:relative}
.inv:before{
  content:"";position:absolute;inset:4% 2.5%;border-radius:28px;
  border:1px solid rgba(185,137,53,.10);pointer-events:none
}
.card{
  width:min(100%,610px);position:relative;overflow:hidden;border-radius:24px;
  background:var(--paper);border:1px solid rgba(184,139,58,.16);
  box-shadow:var(--shadow)
}
.card:after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.78),inset 0 0 34px rgba(105,67,52,.045)
}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.reveal.show{opacity:1;transform:none}
.divider{height:8px;background:linear-gradient(90deg,#f3dfd3,#e6c3b5,#f3dfd3)}

/* ---------- PREMIUM ENVELOPE ---------- */
.hero{
  min-height:100svh;position:relative;display:grid;place-items:center;padding:0;
  overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(255,234,217,.13),transparent 38%),linear-gradient(180deg,#39282b,#24191b)
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.15;pointer-events:none}
.hero:before{width:250px;height:250px;left:-115px;top:14%;background:#dfa98b}
.hero:after{width:280px;height:280px;right:-125px;bottom:6%;background:#a67363}
.envelope-stage{width:100vw;max-width:550px;height:100svh;position:relative;perspective:1800px}
.envelope{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:92%;height:94%;overflow:hidden;border-radius:24px;
  background:radial-gradient(circle at 50% 23%,rgba(255,255,255,.82),transparent 35%),linear-gradient(180deg,#fffdfb 0,#faeee9 46%,#f1dade 100%);
  border:1px solid rgba(210,172,142,.58);
  box-shadow:0 36px 96px rgba(0,0,0,.40),inset 0 0 0 1px rgba(255,255,255,.92)
}
.envelope:before{content:"";position:absolute;inset:15px;border-radius:16px;border:1px solid rgba(161,118,99,.16);z-index:1;pointer-events:none}
.envelope:after{content:"";position:absolute;inset:25px;border-radius:13px;z-index:1;box-shadow:inset 0 0 35px rgba(116,78,64,.06);pointer-events:none}
.texture{position:absolute;inset:0;z-index:1;opacity:.16;pointer-events:none;background-image:radial-gradient(rgba(106,73,62,.16) .6px,transparent .85px);background-size:8px 8px}
.envelope-frame{position:absolute;inset:29px;z-index:2;border:1px solid rgba(185,138,49,.17);border-radius:13px;pointer-events:none}
.envelope-frame:before,.envelope-frame:after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:66%;height:1px;background:linear-gradient(90deg,transparent,rgba(185,138,49,.24),transparent)}
.envelope-frame:before{top:7.5%}.envelope-frame:after{bottom:7.5%}
.emboss{position:absolute;z-index:2;color:#a98270;opacity:.18;pointer-events:none;text-shadow:1px 1px 0 rgba(255,255,255,.88),-1px -1px 0 rgba(120,82,67,.06)}
.emboss.top{top:7%;left:50%;transform:translateX(-50%);font-size:30px;letter-spacing:14px}
.emboss.bottom{bottom:7%;left:50%;transform:translateX(-50%);font-size:34px;letter-spacing:15px}
.emboss.tl{left:6%;top:15%;font-size:52px;transform:rotate(-18deg)}
.emboss.tr{right:6%;top:15%;font-size:52px;transform:scaleX(-1) rotate(-18deg)}
.emboss.bl{left:6%;bottom:16%;font-size:58px;transform:rotate(13deg)}
.emboss.br{right:6%;bottom:16%;font-size:58px;transform:scaleX(-1) rotate(13deg)}
.envelope-fold{position:absolute;z-index:5;pointer-events:none;transition:transform .88s cubic-bezier(.14,.84,.14,1),opacity .65s ease}
.envelope-fold.left{left:0;top:40%;width:50%;height:38%;clip-path:polygon(0 0,100% 100%,0 100%);background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(214,180,182,.28))}
.envelope-fold.right{right:0;top:40%;width:50%;height:38%;clip-path:polygon(100% 0,100% 100%,0 100%);background:linear-gradient(215deg,rgba(255,255,255,.03),rgba(210,176,179,.27))}
.envelope-fold.bottom{left:0;right:0;bottom:0;height:44%;clip-path:polygon(0 100%,50% 0,100% 100%);background:linear-gradient(180deg,rgba(234,205,207,.08),rgba(215,180,184,.42))}
.envelope-flap{position:absolute;z-index:9;left:0;right:0;top:0;height:57%;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;background:linear-gradient(168deg,#fffefa 0,#fbefed 62%,#f0d9dc 100%);border-bottom:1px solid rgba(160,119,100,.17);box-shadow:0 8px 26px rgba(71,44,40,.09);transition:transform 1.08s cubic-bezier(.14,.86,.14,1)}
.envelope-flap:before{content:"";position:absolute;inset:18px 25px 26px;border:1px solid rgba(158,116,97,.15);clip-path:polygon(0 0,100% 0,50% 100%)}
.flap-emboss{position:absolute;top:8.5%;left:50%;transform:translateX(-50%);color:#ad866f;opacity:.18;font-size:28px;letter-spacing:12px}
.reveal-glow{position:absolute;z-index:3;left:19%;right:19%;top:42%;height:31%;opacity:0;background:radial-gradient(ellipse at center,rgba(255,226,151,.93),rgba(255,214,130,.48) 31%,rgba(255,214,130,0) 70%);filter:blur(1px);transition:opacity .6s ease .18s;pointer-events:none}
.inside-card{position:absolute;z-index:6;left:8%;right:8%;bottom:4%;height:68%;overflow:hidden;border-radius:13px;background:#fff;box-shadow:0 25px 56px rgba(49,29,29,.29);transform:translateY(75%) scale(.95);opacity:.02;transition:transform 1.08s .15s cubic-bezier(.15,.86,.15,1),opacity .5s .16s ease}
.inside-card img{width:100%;height:100%;object-fit:cover}
.hero .wax-seal{position:absolute !important;z-index:15 !important;left:50% !important;top:51% !important;width:178px !important;height:178px !important;transform:translate(-50%,-50%);display:grid !important;place-items:center;border-radius:50%;background:radial-gradient(circle at 30% 24%,#fffef8 0 8%,transparent 9%),radial-gradient(circle at 50% 52%,#f6e3af 0,#d9b56c 58%,#aa7522 100%);border:11px solid #fffaf2;box-shadow:0 18px 38px rgba(45,27,27,.30),0 0 0 2px rgba(184,137,48,.20),inset 0 2px 6px rgba(255,255,255,.96),inset 0 -9px 16px rgba(110,69,20,.12);transition:transform .70s ease,opacity .44s ease}
.hero .wax-seal:before{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(112,72,24,.34)}
.hero .wax-seal:after{content:"";position:absolute;inset:22px;border-radius:50%;box-shadow:inset 0 0 14px rgba(104,66,21,.16)}
.hero .wax-seal button{position:relative !important;z-index:3 !important;width:100% !important;height:100% !important;padding:0 !important;background:transparent !important;border:0 !important;box-shadow:none !important;display:grid !important;place-items:center !important}
.hero .wax-seal button span{display:block;width:120px;max-width:120px;text-align:center;font:50px "Great Vibes",cursive;color:#866020;line-height:1;letter-spacing:-.02em;transform:scaleX(.78) translateY(-2px);white-space:nowrap;text-shadow:1px 1px 0 rgba(255,255,255,.76)}
.hero .wax-seal>span{position:absolute;top:calc(100% + 10px);padding:4px 9px;border-radius:999px;background:rgba(255,250,244,.86);color:#8a705e;box-shadow:0 5px 14px rgba(70,45,38,.10);font-size:10px;letter-spacing:.21em;font-weight:700;white-space:nowrap}
.hero-hint{position:absolute;z-index:20;left:50%;bottom:.2%;transform:translateX(-50%);text-align:center;color:#fff;white-space:nowrap;transition:opacity .28s ease}
.hero-hint .pill{display:inline-block;padding:12px 24px;border-radius:999px;background:linear-gradient(180deg,#87304b,#6d2037);border:1px solid rgba(228,197,137,.92);font:600 13px Georgia,serif;box-shadow:0 14px 31px rgba(0,0,0,.31);animation:pulse 2.2s ease-in-out infinite}
.hero-hint small{display:block;margin-top:7px;font:14px Georgia,serif;opacity:.88}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.hero.opened .envelope-flap{transform:rotateX(178deg);z-index:12}
.hero.opened .envelope-fold.left{transform:rotateY(-165deg);opacity:.13}.hero.opened .envelope-fold.right{transform:rotateY(165deg);opacity:.13}.hero.opened .envelope-fold.bottom{transform:rotateX(-165deg);opacity:.13}
.hero.opened .reveal-glow{opacity:1}.hero.opened .wax-seal{transform:translate(-50%,-50%) scale(1.28);opacity:0}.hero.opened .inside-card{transform:translateY(-2%) scale(1);opacity:1}.hero.opened .hero-hint{opacity:0}

/* ---------- SCRATCH / DATE ---------- */
.scratch-stage{position:relative;overflow:hidden;background:#f6e7df}
.scratch-stage>.scratch-base{width:100%}
.scratch-zone{position:absolute;z-index:5;left:18%;top:34%;width:64%;height:40%;border-radius:18px;overflow:hidden}
.scratch-gold{position:absolute;inset:0;background:linear-gradient(145deg,#95651c,#d3a64c 27%,#a87322 52%,#d8b05b 77%,#93631b);box-shadow:inset 0 0 0 1px rgba(255,235,188,.58),0 10px 25px rgba(63,40,18,.25)}
.scratch-gold:after{content:"";position:absolute;inset:-25%;background:repeating-linear-gradient(118deg,rgba(255,238,183,.25) 0 5px,rgba(96,56,14,.13) 5px 10px,rgba(255,237,180,.12) 10px 16px)}
.scratch-label{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;color:#412713;pointer-events:none;text-transform:uppercase}
.scratch-label strong{font:700 clamp(18px,5vw,30px)/1.08 Georgia,serif}.scratch-label span{display:block;font-size:24px;margin-top:8px}
#scratchCanvas{position:absolute;inset:0;z-index:6;width:100%;height:100%;touch-action:none;cursor:crosshair}
.scratch-hint{position:absolute;z-index:8;left:50%;bottom:4%;transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:rgba(116,31,53,.95);color:#fff;font:600 12px Georgia,serif;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.18)}
#dateSection{display:none}#dateSection.visible{display:flex;opacity:1;transform:none}
.date-card{position:relative;overflow:hidden;padding-bottom:0}
.date-card .date-art{display:block;width:100%}
.countdown{
  position:relative;
  left:auto;bottom:auto;transform:none;
  width:calc(100% - 28px);
  margin:14px auto 16px;
  display:flex;gap:6px;align-items:center;justify-content:center;
  padding:11px 12px;
  border:1px solid rgba(185,138,49,.42);
  border-radius:18px;
  background:linear-gradient(180deg,#fffaf3,#f8e8dd);
  box-shadow:0 8px 20px rgba(53,31,29,.12);
  color:#74243d;
}
.unit{min-width:54px;text-align:center}
.unit b{display:block;font:700 19px Georgia,serif;color:#74243d}
.unit small{display:block;margin-top:3px;font-size:10px;color:#6d5148;letter-spacing:.03em}
@media(max-width:680px){
  .countdown{width:calc(100% - 24px);margin:12px auto 14px;padding:10px 8px}
  .unit{min-width:50px}
  .unit b{font-size:18px}
}

/* ---------- ALL LATER PAGES — ORNAMENTAL TREATMENT ---------- */
.inv .card{transform:translateZ(0)}
.inv .card:before{
  content:"✦  ❧  ✦";
  position:absolute;z-index:4;left:50%;top:7px;transform:translateX(-50%);
  padding:4px 10px;border-radius:999px;background:rgba(255,250,245,.68);
  color:rgba(145,101,55,.68);font-size:10px;letter-spacing:4px;backdrop-filter:blur(5px);
  pointer-events:none
}
.inv:nth-of-type(even) .card:before{content:"❧  ♥  ❧"}
.inv .card img{position:relative;z-index:1}
.inv .divider{position:relative;z-index:5;box-shadow:0 0 18px rgba(185,138,49,.10)}

/* Venue: no duplicate button; invisible hotspot remains on artwork */
.venue-card{position:relative}
.venue-hotspot{position:absolute;left:27%;bottom:5.7%;width:46%;height:10.5%;z-index:10;border:0;background:transparent;cursor:pointer}

/* Real action controls */
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:13px;background:linear-gradient(180deg,#fffaf5,#f9eee6);border-top:1px solid rgba(185,138,49,.16)}
.action{min-height:46px;padding:10px 12px;border-radius:15px;border:1px solid var(--gold);background:linear-gradient(180deg,#85304b,#6e2037);color:#fff;cursor:pointer;font:600 12px Georgia,serif;box-shadow:0 8px 18px rgba(87,41,48,.13)}
.action.alt{background:#fff8ef;color:var(--wine)}
.action:active{transform:translateY(1px)}
.footer{text-align:center;padding:32px 16px 66px;color:#6d4e45}.footer .sig{font:47px "Great Vibes",cursive;color:var(--wine)}
@media(max-width:680px){
  .hero .envelope-stage{width:100vw;height:100svh}.hero .envelope{width:92%;height:94%}
  .hero .wax-seal{width:154px !important;height:154px !important}.hero .wax-seal button span{font-size:46px;width:108px;max-width:108px}
  .actions{grid-template-columns:1fr}
  .inv{padding:7px 4px}.card{border-radius:18px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.reveal,.hero .envelope-flap,.hero .envelope-fold,.hero .wax-seal,.hero .inside-card,.hero .hero-hint,.reveal-glow{transition:none}.hero .hero-hint .pill{animation:none}
}

</style>
</head>
<body>
<div class="container">

<section class="hero" id="hero">
  <div class="envelope-stage">
    <div class="envelope" id="envelope">
      <div class="texture"></div>
      <div class="envelope-frame"></div>
      <div class="emboss top">✿ ❀ ✿</div>
      <div class="emboss bottom">❀ ✿ ❀</div>
      <div class="emboss tl">❧</div>
      <div class="emboss tr">❧</div>
      <div class="emboss bl">❧</div>
      <div class="emboss br">❧</div>
      <div class="reveal-glow"></div>
      <div class="inside-card">
        <img src="names.png" alt="Mounisha and Bhanu Sankar invitation">
      </div>
      <div class="envelope-fold left"></div>
      <div class="envelope-fold right"></div>
      <div class="envelope-fold bottom"></div>
      <div class="envelope-flap"><div class="flap-emboss">✿ ❀ ✿</div></div>
      <div class="wax-seal">
        <button id="waxSealBtn" aria-label="Open invitation"><span>M&amp;B</span></button>
        <span>Tap to Open</span>
      </div>
    </div>
    <div class="hero-hint"><div class="pill">Tap to Open</div><small>Touch the seal to open your invitation</small></div>
  </div>
</section>

<section class="inv reveal">
  <div class="card"><img src="names.png" alt="Mounisha and Bhanu Sankar"></div>
</section>

<!-- Scratch screen: only scratch surface + background artwork. -->
<section class="inv reveal" id="scratchSection">
  <div class="card scratch-stage" id="scratchStage">
    <img class="scratch-base" src="scratch.png" alt="Save the Date — scratch to reveal">
    <div class="scratch-zone" id="scratchZone">
      <div class="scratch-gold"></div>
      <div class="scratch-label"><div><strong>SCRATCH<br>TO REVEAL</strong><span>♥</span></div></div>
      <canvas id="scratchCanvas"></canvas>
    </div>
    <div class="scratch-hint" id="scratchHint">Scratch the gold card with your finger ✨</div>
  </div>
</section>

<!-- Date is genuinely locked until scratching completes. -->
<section class="inv reveal" id="dateSection">
  <div class="card date-card">
    <img class="date-art" src="date.png" alt="Saturday 05 September 2026">
    <div class="countdown">
      <div class="unit"><b id="days">00</b><small>Days</small></div>
      <div class="unit"><b id="hours">00</b><small>Hours</small></div>
      <div class="unit"><b id="mins">00</b><small>Min</small></div>
      <div class="unit"><b id="secs">00</b><small>Sec</small></div>
    </div>
  </div>
</section>

<section class="inv reveal"><div class="card"><img src="couple.png" alt="Mounisha and Bhanu Sankar"></div></section>

<section class="inv reveal">
  <div class="card">
    <img src="ruthala.png" alt="Ruthala's Family">
    <div class="divider"></div>
    <img src="bommasani.png" alt="Bommasani's Family">
  </div>
</section>

<section class="inv reveal"><div class="card"><img src="schedule.png" alt="Event Schedule"></div></section>

<section class="inv reveal">
  <div class="card venue-card">
    <img src="venue.png" alt="Avira Banquets">
    <!-- Invisible hotspot sits over the Get Directions button already printed in the artwork. -->
    <a class="venue-hotspot" target="_blank" rel="noopener"
       aria-label="Get directions to Avira Banquets"
       href="https://www.google.com/maps/search/?api=1&query=Avira%20Banquets%2C%20opp%20vajra%20grounds%2C%20Brindavan%20Colony%2C%20Pragathi%20Nagar%2C%20Labbipet%2C%20Vijayawada"></a>
  </div>
</section>

<section class="inv reveal"><div class="card"><img src="closing.png" alt="With Love, Mounisha and Bhanu Sankar"></div></section>

<section class="inv reveal">
  <div class="card">
    <img src="actions.png" alt="Invitation actions">
    <div class="actions">
      <button class="action" id="calendarBtn">Add to Calendar</button>
      <button class="action alt" id="shareBtn">Share Invite</button>
      <button class="action" id="whatsappBtn">RSVP on WhatsApp</button>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="sig">Mounisha &amp; Bhanu Sankar</div>
  <div>05 September 2026 · 10:32 AM · Avira Banquets · Vijayawada</div>
</footer>

</div>

<script>
/* ---------- Opening ---------- */
const waxSealBtn=document.getElementById('waxSealBtn');
const hero=document.getElementById('hero');
function openEnvelope(){
  if(hero.classList.contains('opened')) return;
  hero.classList.add('opened');
  try{navigator.vibrate?.([18,28,45]);}catch(e){}
  setTimeout(()=>window.scrollTo({top:window.innerHeight*.98,behavior:'smooth'}),1650);
}
waxSealBtn.addEventListener('click',(e)=>{e.stopPropagation();openEnvelope()});
hero.addEventListener('click',openEnvelope);

/* ---------- Scroll reveal ---------- */
const observer=new IntersectionObserver(entries=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')});
},{threshold:.08});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

/* ---------- REAL scratch card ---------- */
(()=>{
  const stage=document.getElementById('scratchStage');
  const zone=document.getElementById('scratchZone');
  const canvas=document.getElementById('scratchCanvas');
  const hint=document.getElementById('scratchHint');
  const dateSection=document.getElementById('dateSection');
  if(!stage||!zone||!canvas||!hint||!dateSection)return;

  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  let dpr=1,drawing=false,done=false,moves=0,last=null;

  function paint(){
    const r=zone.getBoundingClientRect();
    if(r.width<20||r.height<20)return;
    dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.round(r.width*dpr);
    canvas.height=Math.round(r.height*dpr);
    canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.globalCompositeOperation='source-over';
    ctx.clearRect(0,0,r.width,r.height);

    const g=ctx.createLinearGradient(0,0,r.width,r.height);
    g.addColorStop(0,'#95651c');g.addColorStop(.24,'#d2a447');
    g.addColorStop(.50,'#a87322');g.addColorStop(.76,'#d7af59');g.addColorStop(1,'#93631b');
    ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);

    ctx.globalAlpha=.28;
    for(let i=-r.height;i<r.width+r.height;i+=18){
      ctx.strokeStyle=(i%36===0)?'#f6dda0':'#684216';
      ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+r.height,r.height);ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle='#412713';ctx.textAlign='center';ctx.textBaseline='middle';
    const fs=Math.max(18,Math.min(30,r.width*.048));
    ctx.font=`700 ${fs}px Georgia`;
    ctx.fillText('SCRATCH',r.width/2,r.height/2-14);
    ctx.fillText('TO REVEAL',r.width/2,r.height/2+18);
    ctx.font='24px serif';ctx.fillText('♥',r.width/2,r.height/2+58);
  }

  function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

  function erase(x,y){
    ctx.save();ctx.globalCompositeOperation='destination-out';
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();
    if(last){ctx.moveTo(last.x,last.y);ctx.lineTo(x,y)}else{ctx.moveTo(x,y);ctx.lineTo(x+.1,y)}
    ctx.lineWidth=72;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,36,0,Math.PI*2);ctx.fill();
    ctx.restore();
    last={x,y};moves++;

    if(!done && moves%12===0){
      const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
      let clear=0,total=0;
      for(let i=3;i<data.length;i+=20){total++;if(data[i]<20)clear++}
      if(total&&clear/total>.45){
        done=true;
        hint.textContent='✨ Date revealed';
        hint.style.background='rgba(62,110,70,.96)';
        dateSection.classList.add('visible','show');
        setTimeout(()=>dateSection.scrollIntoView({behavior:'smooth',block:'start'}),450);
        setTimeout(()=>ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr),600);
      }
    }
  }

  canvas.addEventListener('pointerdown',e=>{drawing=true;last=null;canvas.setPointerCapture?.(e.pointerId);const p=point(e);erase(p.x,p.y)});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);erase(p.x,p.y)});
  canvas.addEventListener('pointerup',()=>{drawing=false;last=null});
  canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});
  window.addEventListener('resize',paint);
  requestAnimationFrame(paint);
})();

/* ---------- Countdown ---------- */

(()=>{
  const target=new Date('2026-09-05T10:32:00+05:30').getTime();
  function tick(){
    let diff=Math.max(0,target-Date.now());
    const d=Math.floor(diff/86400000);diff%=86400000;
    const h=Math.floor(diff/3600000);diff%=3600000;
    const m=Math.floor(diff/60000);diff%=60000;
    const s=Math.floor(diff/1000);
    document.getElementById('days').textContent=String(d).padStart(2,'0');
    document.getElementById('hours').textContent=String(h).padStart(2,'0');
    document.getElementById('mins').textContent=String(m).padStart(2,'0');
    document.getElementById('secs').textContent=String(s).padStart(2,'0');
  }
  tick();setInterval(tick,1000);
})();
